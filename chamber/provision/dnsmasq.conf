# Sandbox resolver on det0 only. Every lookup a sandbox makes is logged, so
# the Chamber can name the IPs it connects to with the answers it actually got.
interface=det0
except-interface=lo
listen-address=10.250.0.1
# det0 can appear after dnsmasq starts (docker creates it); bind-dynamic picks it up.
bind-dynamic
no-resolv
no-hosts
no-dhcp-interface=det0
server=1.1.1.1
server=8.8.8.8
# No cache: every answer is a logged upstream reply, not a "cached" line.
cache-size=0
log-queries=extra
log-facility=/var/log/pr-detonator/dns.log
# Exfil/tunnel/IP-lookup services answer with a TEST-NET sinkhole (generated by setup.sh
# from shared/exfil_services.py).
conf-file=/etc/pr-detonator/sinkhole.conf
