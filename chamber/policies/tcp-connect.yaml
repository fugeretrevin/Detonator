apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "detonator-connect"
spec:
  kprobes:
  # Fires on the connect *attempt*, so payloads aimed at unreachable IPs are still captured.
  - call: "tcp_connect"
    syscall: false
    args:
    - index: 0
      type: "sock"
    selectors:
    - matchArgs:
      - index: 0
        operator: "NotDAddr"
        values:
        - "127.0.0.0/8"
