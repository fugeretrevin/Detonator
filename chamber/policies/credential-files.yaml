# Opens of the bait credential files planted in the sandbox's home (chamber/sandbox/bait/).
# Only these paths are reported, so normal file I/O never floods the log.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "credential-files"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/home/runner/.npmrc"
        - "/home/runner/.aws/"
        - "/home/runner/.ssh/"
        - "/home/runner/.git-credentials"
