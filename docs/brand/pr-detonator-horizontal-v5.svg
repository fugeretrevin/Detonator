<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 256" width="920" height="256"
     role="img" aria-labelledby="title">
  <title id="title">PR Detonator</title>
  <g id="icon">
  <defs>
    <!-- Costume: union of an ellipse and 10 puffs. Stroked pass below, fill pass on
         top, so only the outer edge carries the outline. -->
    <g id="wool">
      <ellipse cx="128" cy="128" rx="80" ry="76"/>
      <circle cx="149.2" cy="52.7" r="22"/>
      <circle cx="186.0" cy="72.8" r="22"/>
      <circle cx="207.2" cy="107.8" r="22"/>
      <circle cx="207.2" cy="148.2" r="22"/>
      <circle cx="186.0" cy="183.2" r="22"/>
      <circle cx="70.0" cy="183.2" r="22"/>
      <circle cx="48.8" cy="148.2" r="22"/>
      <circle cx="48.8" cy="107.8" r="22"/>
      <circle cx="70.0" cy="72.8" r="22"/>
      <circle cx="106.8" cy="52.7" r="22"/>
    </g>
    <g id="paws">
      <ellipse cx="89" cy="220" rx="10" ry="12"/>
      <circle cx="99" cy="211" r="4.5"/>
      <circle cx="101.5" cy="220" r="4.5"/>
      <circle cx="99" cy="229" r="4.5"/>
      <ellipse cx="167" cy="220" rx="10" ry="12"/>
      <circle cx="157" cy="211" r="4.5"/>
      <circle cx="154.5" cy="220" r="4.5"/>
      <circle cx="157" cy="229" r="4.5"/>
    </g>
    <clipPath id="bomb-clip">
      <circle cx="128" cy="210" r="32"/>
    </clipPath>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Wolf ears, standing up behind the hood -->
    <g id="wolf-ears" fill="#575861" stroke="#151518" stroke-width="6">
      <path d="M75 62 L80 4 L117 40 Z"/>
      <path d="M181 62 L176 4 L139 40 Z"/>
    </g>

    <!-- Sheep costume -->
    <use href="#wool" fill="#151518" stroke="#151518" stroke-width="12"/>
    <use href="#wool" fill="#FFFFFF"/>

    <!-- Wolf face: broad brow, cheek points, snout with room for a small gasp -->
    <path id="wolf-face" fill="#575861" stroke="#151518" stroke-width="6"
          d="M84 92 C84 70 104 60 128 60 C152 60 172 70 172 92
             L180 116 L154 122 L139 146 Q139 161 128 161 Q117 161 117 146 L102 122 L76 116 Z"/>
    <path id="nose" fill="#151518" d="M120 131 H136 Q134 140 128 142 Q122 140 120 131 Z"/>
    <ellipse id="mouth" fill="#151518" cx="128" cy="152" rx="4.5" ry="5.5"/>

    <!-- Shock: wide eyes, small pupils dropped to the bomb, black brows arched high -->
    <g id="eyes">
      <ellipse fill="#FFFFFF" cx="107" cy="104" rx="12.5" ry="14.5"/>
      <ellipse fill="#FFFFFF" cx="149" cy="104" rx="12.5" ry="14.5"/>
      <circle fill="#151518" cx="109" cy="111" r="3"/>
      <circle fill="#151518" cx="147" cy="111" r="3"/>
    </g>
    <g id="brows" fill="none" stroke="#151518" stroke-width="8">
      <path d="M95 82 Q105 70 118 76"/>
      <path d="M161 82 Q151 70 138 76"/>
    </g>
    <!-- Shock lines -->
    <g id="shock-lines" fill="none" stroke="#151518" stroke-width="6">
      <path d="M42 26 L54 40"/>
      <path d="M28 50 L44 56"/>
      <path d="M214 26 L202 40"/>
      <path d="M228 50 L212 56"/>
    </g>

    <!-- Bomb: the base of the logo. A thin white rim separates it from the wool
         outline and keeps its edge visible on dark backgrounds. -->
    <g id="bomb">
      <path id="fuse-knockout" fill="none" stroke="#FFFFFF" stroke-width="14"
            d="M150 184 Q160 168 174 170"/>
      <path id="fuse" fill="none" stroke="#151518" stroke-width="6"
            d="M150 184 Q160 168 174 170"/>
      <circle id="bomb-rim" cx="128" cy="210" r="36" fill="#FFFFFF"/>
      <rect id="fuse-cap" x="138" y="178" width="18" height="12" rx="2"
            fill="#151518" transform="rotate(42 147 184)"/>
      <circle id="bomb-body" cx="128" cy="210" r="32" fill="#151518"/>
      <path id="bomb-glint" fill="none" stroke="#FFFFFF" stroke-width="6"
            d="M112.7 197.1 A20 20 0 0 1 124.5 190.3"/>
      <path id="spark" fill="#E5382D"
            d="M182 156 Q183.5 168.5 196 170 Q183.5 171.5 182 184 Q180.5 171.5 168 170 Q180.5 168.5 182 156 Z"/>
    </g>

    <!-- Paws: white knockout only where they cross the bomb, then outline, then fill -->
    <use href="#paws" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" clip-path="url(#bomb-clip)"/>
    <use href="#paws" fill="#151518" stroke="#151518" stroke-width="12"/>
    <use href="#paws" fill="#575861"/>
  </g>
  </g>
  <text id="wordmark" x="284" y="160" fill="#151518"
        font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="92" font-weight="600" letter-spacing="-1.5">PR Detonator</text>
</svg>
